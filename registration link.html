<!DOCTYPE html>
<html>
<head>
<title>Registration Page</title>
</head>


<body bgcolor="lightblue">

<h2>Student Registration Form</h2>
<form action="C:/webdev/registration%20link.html" method="post">


<label>First Name:</label>
<input type="text"
     name="fname"><br><br>

<label>Middle Name:</label>
<input type="text"
      name="mname"><br><br>

<label>Last Name:</label>
<input type="text"
       name="lname"><br><br>



    <label>Gender:</label><br>
    <input type="radio" name="gender" value="male"> Male<br>
    <input type="radio" name="gender" value="female"> Female<br>
    <input type="radio" name="gender" value="other"> Other<br><br>


    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="30"></textarea> <br><br>

 
    <label>College Name:</label>
    <select name="college">
        <option value="">Select College</option>
        <option value="DYPCET">DYPCET Kolhapur</option>
        <option value="KIT">KIT College</option>
        <option value="SGM">SGM College</option>
    </select>
    <br><br>

     <label>Branch:</label>
    <select name="branch">
        <option value="">Select Branch</option>
        <option value="CSE">Computer Science</option>
        <option value="AIML">Artificial Intelligence & ML</option>
        <option value="DS">Data Science</option>
        <option value="MECH">Mechanical</option>
        <option value="CIVIL">Civil</option>
    </select>
    <br><br>

    <label>Technical Skills:</label><br>
    <input type="checkbox" name="skill" value="html"> HTML<br>
    <input type="checkbox" name="skill" value="css"> CSS<br>
    <input type="checkbox" name="skill" value="java"> Java<br>
    <input type="checkbox" name="skill" value="python"> Python<br>
    <input type="checkbox" name="skill" value="cpp"> C++<br><br>

 
    <input type="submit" value="Submit">

</form>

</body>
</html>
