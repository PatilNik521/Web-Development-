<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* The Header/Navigation */
        nav {
            background: #333;
            padding: 15px;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffcc00;
        }

        /* The Main Content Area */
        .content-area {
            display: flex;         /* Split into columns */
            flex: 10;               /* Fill the rest of the screen */
            overflow: hidden;      /* Prevent the whole page from scrolling */
        }

        .sidebar {
            flex: 0 0 25%;         /* 25% Width Sidebar */
            background: #f4f4f4;
            overflow-y: auto;      /* Scroll vertically if list is long */
            padding: 10px;
        }

        .main-view {
            flex: 0 0 75%;         /* 75% Width Main Area */
            border: none;
        }
    </style>
</head>
<body>

    <nav>
        <a href="table.html">About Us</a>
        <a href="bill.html">Home</a>
        <a href="https://www.wikipedia.org">Product </a>
    </nav>

    <h1>Dashboard</h1>

    <div class="content-area">
        <div class="sidebar">
            <h3>Menu</h3>
            <p>Item 1</p>
            <p>Item 2</p>
            <p>Item 3</p>
        </div>

        <iframe name="display" class="main-view" src="bill.html"></iframe>
    </div>

</body>
</html>
